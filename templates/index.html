<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Config Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="dark-mode">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="top-header">
        <div class="header-controls">
            <button class="control-btn" id="themeToggle" title="Toggle Dark/Light Mode">
                <svg id="lightIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="darkIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
    </div>

    <div class="logo-container">
        <img src="/static/sio.png" alt="SIO" class="logo">
    </div>

    <div class="container main-container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- Provider tabs -->
                <ul class="nav nav-tabs mb-3" id="providerTabs">
                    <li class="nav-item">
                        <button class="nav-link active" id="pia-tab" data-bs-toggle="tab" data-bs-target="#pia" type="button">PIA</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="proton-tab" data-bs-toggle="tab" data-bs-target="#proton" type="button">ProtonVPN</button>
                    </li>
                </ul>

                <div class="tab-content">

                    <!-- PIA Tab -->
                    <div class="tab-pane fade show active" id="pia">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="text-center mb-0">PIA Config Generator</h3>
                            </div>
                            <div class="card-body">
                                <form id="piaForm">
                                    <div class="mb-3">
                                        <label class="form-label">PIA Username</label>
                                        <input type="text" class="form-control" name="username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">PIA Password</label>
                                        <input type="password" class="form-control" name="password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Region</label>
                                        <select class="form-control" name="region" id="piaRegion" required>
                                            <option value="">Loading regions...</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Config Type</label>
                                        <div class="d-flex gap-2">
                                            <div class="form-check flex-fill">
                                                <input class="form-check-input" type="radio" name="config_type" value="wireguard" checked>
                                                <label class="form-check-label">WireGuard</label>
                                            </div>
                                            <div class="form-check flex-fill">
                                                <input class="form-check-input" type="radio" name="config_type" value="openvpn_udp">
                                                <label class="form-check-label">OpenVPN UDP</label>
                                            </div>
                                            <div class="form-check flex-fill">
                                                <input class="form-check-input" type="radio" name="config_type" value="openvpn_tcp">
                                                <label class="form-check-label">OpenVPN TCP</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary">
                                            <span class="btn-text">Generate Config</span>
                                            <span class="spinner spinner-border spinner-border-sm d-none" role="status"></span>
                                        </button>
                                    </div>
                                </form>
                                <div class="alert alert-danger mt-3 d-none pia-error"></div>
                                <div class="alert alert-success mt-3 d-none pia-success"></div>
                            </div>
                        </div>
                    </div>

                    <!-- ProtonVPN Tab -->
                    <div class="tab-pane fade" id="proton">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="text-center mb-0">ProtonVPN Config Generator</h3>
                            </div>
                            <div class="card-body">
                                <form id="protonForm">
                                    <div class="mb-3">
                                        <label class="form-label">ProtonVPN Username</label>
                                        <input type="text" class="form-control" name="username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">ProtonVPN Password</label>
                                        <input type="password" class="form-control" name="password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Server</label>
                                        <select class="form-control" name="server" id="protonServer" required>
                                            <option value="">Loading servers...</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Protocol</label>
                                        <div class="d-flex gap-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="protocol" value="udp" checked>
                                                <label class="form-check-label">UDP (faster)</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="protocol" value="tcp">
                                                <label class="form-check-label">TCP (more compatible)</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary">
                                            <span class="btn-text">Generate Config</span>
                                            <span class="spinner spinner-border spinner-border-sm d-none" role="status"></span>
                                        </button>
                                    </div>
                                </form>
                                <p class="text-muted mt-2" style="font-size:0.8rem;">Use your OpenVPN/IKEv2 credentials from account.proton.me/vpn/open-vpn-ike-v2</p>
                                <div class="alert alert-danger mt-3 d-none proton-error"></div>
                                <div class="alert alert-success mt-3 d-none proton-success"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const lightIcon = document.getElementById('lightIcon');
        const darkIcon = document.getElementById('darkIcon');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            body.classList.replace('dark-mode', 'light-mode');
            lightIcon.style.display = 'block';
            darkIcon.style.display = 'none';
        }
        themeToggle.addEventListener('click', function() {
            if (body.classList.contains('light-mode')) {
                body.classList.replace('light-mode', 'dark-mode');
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'block';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.replace('dark-mode', 'light-mode');
                lightIcon.style.display = 'block';
                darkIcon.style.display = 'none';
                localStorage.setItem('theme', 'light');
            }
        });

        // Load PIA regions
        fetch('/pia/regions')
            .then(r => r.json())
            .then(regions => {
                const sel = document.getElementById('piaRegion');
                sel.innerHTML = '<option value="">Select a region...</option>';
                regions.forEach(r => {
                    const o = document.createElement('option');
                    o.value = r; o.textContent = r;
                    sel.appendChild(o);
                });
            }).catch(() => {
                document.getElementById('piaRegion').innerHTML = '<option value="">Error loading regions</option>';
            });

        // Load ProtonVPN servers
        fetch('/proton/regions')
            .then(r => r.json())
            .then(servers => {
                const sel = document.getElementById('protonServer');
                sel.innerHTML = '<option value="">Select a server...</option>';
                servers.forEach(s => {
                    const o = document.createElement('option');
                    o.value = s; o.textContent = s;
                    sel.appendChild(o);
                });
            }).catch(() => {
                document.getElementById('protonServer').innerHTML = '<option value="">Error loading servers</option>';
            });

        // Generic form handler
        function handleForm(formId, endpoint, errorClass, successClass) {
            document.getElementById(formId).addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = this.querySelector('button[type=submit]');
                const btnText = btn.querySelector('.btn-text');
                const spinner = btn.querySelector('.spinner');
                const errorDiv = document.querySelector('.' + errorClass);
                const successDiv = document.querySelector('.' + successClass);

                errorDiv.classList.add('d-none');
                successDiv.classList.add('d-none');
                btn.disabled = true;
                btnText.textContent = 'Generating...';
                spinner.classList.remove('d-none');

                fetch(endpoint, { method: 'POST', body: new FormData(this) })
                    .then(response => {
                        if (response.ok) {
                            const cd = response.headers.get('Content-Disposition');
                            const match = cd && cd.match(/filename="?(.+?)"?$/);
                            const filename = match ? match[1] : 'vpn-config.ovpn';
                            return response.blob().then(blob => ({ blob, filename }));
                        } else {
                            return response.json().then(d => Promise.reject(d.error));
                        }
                    })
                    .then(({ blob, filename }) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click();
                        URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                        successDiv.textContent = 'Config downloaded successfully!';
                        successDiv.classList.remove('d-none');
                    })
                    .catch(err => {
                        errorDiv.textContent = err || 'An error occurred';
                        errorDiv.classList.remove('d-none');
                    })
                    .finally(() => {
                        btn.disabled = false;
                        btnText.textContent = 'Generate Config';
                        spinner.classList.add('d-none');
                    });
            });
        }

        handleForm('piaForm', '/pia/generate', 'pia-error', 'pia-success');
        handleForm('protonForm', '/proton/generate', 'proton-error', 'proton-success');
    </script>
</body>
</html>
